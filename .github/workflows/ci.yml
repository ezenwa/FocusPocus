name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WinUI frontend
        run: dotnet build .\src\FocusPocus.UI\FocusPocus.UI.csproj -c Release
      - name: Build overlay engine
        run: dotnet build .\src\FocusPocus.Engine\FocusPocus.Engine.csproj -c Release
