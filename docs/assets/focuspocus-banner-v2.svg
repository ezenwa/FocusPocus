<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">FocusPocus</title>
  <desc id="desc">Magic that follows every move</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#150720" stop-opacity=".08"/>
      <stop offset=".46" stop-color="#12051f" stop-opacity=".32"/>
      <stop offset="1" stop-color="#090310" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffe16a" stop-opacity=".46"/>
      <stop offset=".35" stop-color="#f4ad4c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7b2cbf" stop-opacity="0"/>
    </radialGradient>
    <filter id="moonDepth" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#08010f" flood-opacity=".7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ffe36d" flood-opacity=".62"/>
    </filter>
    <filter id="titleDepth" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>

  <image href="focuspocus-night-background.png" width="1600" height="520" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="520" fill="url(#shade)"/>

  <circle cx="287" cy="260" r="250" fill="url(#halo)"/>
  <image href="focuspocus-moon.png" x="112" y="85" width="350" height="350" filter="url(#moonDepth)"/>

  <g filter="url(#titleDepth)" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif">
    <text x="535" y="246" fill="#ffffff" font-size="108" font-weight="700" letter-spacing="-3">FocusPocus</text>
    <text x="542" y="326" fill="#ffe05a" font-size="40" font-weight="500" letter-spacing=".2">Magic that follows every move</text>
  </g>
</svg>
