<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">FocusPocus</title>
  <desc id="desc">Magic that follows every move</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13071f"/>
      <stop offset="0.55" stop-color="#26103d"/>
      <stop offset="1" stop-color="#35007f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffdd55" stop-opacity=".28"/>
