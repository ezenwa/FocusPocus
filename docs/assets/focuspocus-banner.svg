    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="38" fill="url(#bg)"/>
