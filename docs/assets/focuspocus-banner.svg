  <text x="522" y="328" fill="#ffdd55" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="500">Magic that follows every move</text>
  <path d="M522 370H1210" stroke="#ffdd55" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <circle cx="1265" cy="370" r="15" fill="#35c2ff"/>
